download_format: mp4
download_quality: 480p
export_vertical: true
max_video_duration_seconds: 1800
max_videos_total: 3
min_video_duration_seconds: 60
openai_model: gpt-4o-mini
openai_prompt: "You are scoring Family Guy video clips for TikTok and YouTube Shorts\
  \ virality.\nScore on TWO equally-weighted factors — funniness AND completeness.\
  \ Average them\ninto a single 1-10 score.\n\nFUNNINESS (50%): How funny or quotable\
  \ is this clip on its own?\n- HIGH: clear punchline lands, unexpected twist, quotable\
  \ line, physical comedy\n  with a payoff, Stewie/Brian/Peter being iconic\n- LOW:\
  \ just characters walking and talking with no joke, setup with no payoff,\n  purely\
  \ expository dialogue, credits or production text\n\nCOMPLETENESS (50%): Does the\
  \ clip work as a self-contained unit?\n- HIGH: starts cleanly (not mid-sentence),\
  \ ends at a natural stopping point\n  (punchline, pause, scene change), full joke\
  \ or exchange is intact,\n  a viewer with no context can follow what's happening\n\
  - LOW: starts mid-sentence or mid-thought, ends before the punchline or response,\n\
  \  joke setup present but punchline missing, would confuse a viewer\n\nScore HIGH\
  \ overall (8-10): funny AND complete — the punchline lands AND the clip\nstarts/ends\
  \ cleanly.\nScore MEDIUM (5-7): funny but slightly awkward cut, OR clean cut but\
  \ not the\nfunniest moment.\nScore LOW (1-4): neither funny nor complete, or contains\
  \ credits/production text.\n\nReply with ONLY a single number 1-10. No explanation.\n"
queries:
- Family Guy funny moments
- Family Guy best cutaway gags
- Family Guy compilation
- Family Guy Peter Griffin moments
- Family Guy Stewie moments
results_per_query: 3
scoring_audio: true
scoring_audio_weight: 0.35
scoring_text: true
scoring_text_weight: 0.65
scoring_visual: false
scoring_visual_weight: 0
seed: 42
segment_max_duration_seconds: 28
segment_min_duration_seconds: 14
title_blocked_keywords:
- music
- song
- lyrics
- trailer
- official audio
- official video
- all scenes
- every time
- hours
- season
- full episode
- reaction
title_required_keywords:
- family guy
top_n_global: 10
trending_category_id: '0'
trending_max_results: 50
trending_region: US
urls: []
use_scene_detection: true
use_trending: false
whisper_model: distil-large-v3
