# clip-farm pipeline configuration (Whisper + OpenAI ranking)

# Search queries (yt-dlp will search YouTube for each)
queries:
  - "Family Guy funny moments"
  - "Family Guy best cutaway gags"
  - "Family Guy compilation"
  - "Family Guy Peter Griffin moments"
  - "Family Guy Stewie moments"

# Optional: direct YouTube URLs to include in the pool
urls: []

# How many search results to take per query (before applying max_videos_total)
results_per_query: 5

# Cap total number of source videos across all queries + urls
max_videos_total: 3

# Download format (prefer mp4 for compatibility)
download_format: "mp4"

# Download quality — "best" for production, "480p" for fast testing
download_quality: "480p"

# Filter source videos by duration (seconds)
min_video_duration_seconds: 60
max_video_duration_seconds: 1800

# Deterministic ordering for download (optional)
seed: 42

# --- Title filter ---
# At least one required keyword must appear in title (empty = no requirement)
title_required_keywords:
  - "family guy"

# Videos containing any blocked keyword are skipped immediately
title_blocked_keywords:
  - "music"
  - "song"
  - "lyrics"
  - "trailer"
  - "official audio"
  - "official video"
  - "all scenes"
  - "every time"
  - "hours"
  - "season"
  - "full episode"
  - "reaction"

# Whisper: segment boundaries from transcription (merge into this duration range)
segment_min_duration_seconds: 18.0
segment_max_duration_seconds: 25.0

# Ranking: take top N segments globally (by OpenAI score)
top_n_global: 10

# Whisper API model
whisper_model: "whisper-1"

# OpenAI: model and optional custom prompt for scoring (1-10)
openai_model: "gpt-4o-mini"
openai_prompt: |
  You are scoring Family Guy animated clips for short-form social media virality
  (TikTok, YouTube Shorts, Instagram Reels). Rate the transcript from 1 to 10.

  Score HIGH (8-10) if: the clip has a clear punchline, ends on a laugh,
  contains a quotable or relatable joke, has an unexpected twist, or references
  modern life in a funny way (phones, jobs, social media, relationships).
  Bonus points if the last line of the transcript IS the punchline/payoff.

  Score LOW (1-4) if: the clip is mid-scene with no payoff, requires episode
  context to understand, is just characters talking without a joke landing,
  ends abruptly before the punchline, or contains production credits or
  watermark text like "Executive Producer" or "Co-Executive Producer".

  Score MEDIUM (5-7) for everything else.

  Reply with ONLY a single number 1-10. No explanation.

# --- Multi-signal scoring ---
# Enable/disable individual scoring signals (disabled signals have weight redistributed)
scoring_text: true
scoring_audio: true
scoring_visual: false     # uses GPT-4o vision — costs money per clip

# --- Scene detection ---
# Snap Whisper chunk boundaries to nearest scene change for cleaner cuts
use_scene_detection: true

# --- Vertical export ---
# After ranking, crop top clips to 9:16 and save to data/outputs/
export_vertical: true

# --- YouTube Trending ---
# Set to true to pull from YouTube trending before search queries
use_trending: false
trending_region: "US"
trending_category_id: "0"   # 0=all, 10=music, 20=gaming, 23=comedy, 24=entertainment
trending_max_results: 50
