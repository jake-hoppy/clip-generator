# clip-farm pipeline configuration (Whisper + OpenAI ranking)

# Search queries (yt-dlp will search YouTube for each)
queries:
  - "Family Guy funny moments"
  - "Family Guy best cutaway gags"
  - "Family Guy compilation"
  - "Family Guy Peter Griffin moments"
  - "Family Guy Stewie moments"

# Optional: direct YouTube URLs to include in the pool
urls: []

# How many search results to take per query (before applying max_videos_total)
results_per_query: 3

# Cap total number of source videos across all queries + urls
max_videos_total: 3

# Download format (prefer mp4 for compatibility)
download_format: "mp4"

# Download quality — "best" for production, "480p" for fast testing
download_quality: "480p"

# Filter source videos by duration (seconds)
min_video_duration_seconds: 60
max_video_duration_seconds: 1800

# Deterministic ordering for download (optional)
seed: 42

# --- Title filter ---
# At least one required keyword must appear in title (empty = no requirement)
title_required_keywords:
  - "family guy"

# Videos containing any blocked keyword are skipped immediately
title_blocked_keywords:
  - "music"
  - "song"
  - "lyrics"
  - "trailer"
  - "official audio"
  - "official video"
  - "all scenes"
  - "every time"
  - "hours"
  - "season"
  - "full episode"
  - "reaction"

# Whisper: segment boundaries from transcription (merge into this duration range)
segment_min_duration_seconds: 14.0
segment_max_duration_seconds: 28.0

# Ranking: take top N segments globally (by OpenAI score)
top_n_global: 10

# Whisper API model
whisper_model: "distil-large-v3"

# OpenAI: model and optional custom prompt for scoring (1-10)
openai_model: "gpt-4o-mini"
openai_prompt: |
  You are scoring Family Guy video clips for TikTok and YouTube Shorts virality.
  Score on TWO equally-weighted factors — funniness AND completeness. Average them
  into a single 1-10 score.

  FUNNINESS (50%): How funny or quotable is this clip on its own?
  - HIGH: clear punchline lands, unexpected twist, quotable line, physical comedy
    with a payoff, Stewie/Brian/Peter being iconic
  - LOW: just characters walking and talking with no joke, setup with no payoff,
    purely expository dialogue, credits or production text

  COMPLETENESS (50%): Does the clip work as a self-contained unit?
  - HIGH: starts cleanly (not mid-sentence), ends at a natural stopping point
    (punchline, pause, scene change), full joke or exchange is intact,
    a viewer with no context can follow what's happening
  - LOW: starts mid-sentence or mid-thought, ends before the punchline or response,
    joke setup present but punchline missing, would confuse a viewer

  Score HIGH overall (8-10): funny AND complete — the punchline lands AND the clip
  starts/ends cleanly.
  Score MEDIUM (5-7): funny but slightly awkward cut, OR clean cut but not the
  funniest moment.
  Score LOW (1-4): neither funny nor complete, or contains credits/production text.

  Reply with ONLY a single number 1-10. No explanation.

# --- Multi-signal scoring ---
# Enable/disable individual scoring signals (disabled signals have weight redistributed)
scoring_text: true
scoring_audio: true
scoring_visual: false     # uses GPT-4o vision — costs money per clip

# Scoring signal weights (completeness/text is now the primary signal)
scoring_text_weight: 0.65
scoring_audio_weight: 0.35
scoring_visual_weight: 0.00

# --- Scene detection ---
# Snap Whisper chunk boundaries to nearest scene change for cleaner cuts
use_scene_detection: true

# --- Vertical export ---
# After ranking, crop top clips to 9:16 and save to data/outputs/
export_vertical: true

# --- YouTube Trending ---
# Set to true to pull from YouTube trending before search queries
use_trending: false
trending_region: "US"
trending_category_id: "0"   # 0=all, 10=music, 20=gaming, 23=comedy, 24=entertainment
trending_max_results: 50

# https://freefamilyguy.com/ <--- place to get family guy mp4s