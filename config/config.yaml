# clip-farm pipeline configuration (Whisper + OpenAI ranking)

# Search queries (yt-dlp will search YouTube for each)
queries:
  - "Family guy best moments"
  - "Parks and Rec funniest moments"

# Optional: direct YouTube URLs to include in the pool
urls: []

# How many search results to take per query (before applying max_videos_total)
results_per_query: 10

# Cap total number of source videos across all queries + urls
max_videos_total: 25

# Download format (prefer mp4 for compatibility)
download_format: "mp4"

# Filter source videos by duration (seconds)
min_video_duration_seconds: 60
max_video_duration_seconds: 1800

# Deterministic ordering for download (optional)
seed: 42

# Chunking: "whisper" = merge Whisper segments into chunks (min/max below), LLM only scores; "llm" = LLM picks boundaries + score
chunk_mode: "llm"

# Clip length: for whisper mode = merged segment length; for llm mode = bounds AI may choose
clip_min_duration_seconds: 20.0
clip_max_duration_seconds: 45.0

# Extra seconds added after each clip's end so it doesn't cut off abruptly (tail).
clip_tail_seconds: 1.0

# Ranking: take top N segments globally (by OpenAI score)
top_n_global: 20

# Whisper API model
whisper_model: "whisper-1"

# OpenAI: model for API check and clip selection/ranking (gpt-5.4 = latest frontier; see https://platform.openai.com/docs/models)
openai_model: "gpt-5.4"

# openai_prompt: "..."  # optional; default asks for viral/funny clip potential 1-10
